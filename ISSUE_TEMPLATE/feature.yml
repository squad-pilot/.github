name: Feature
description: Something a user can do that they could not before
type: Feature
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What the user gets, and why it matters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: One or two checks that prove it works.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S: under 2 hours", "M: half a day", "L: more than a day, split it"]
