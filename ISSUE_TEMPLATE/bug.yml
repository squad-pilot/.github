name: Bug
description: Something that worked, or should work, and does not
type: Bug
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: App version, endpoint, or job name.
